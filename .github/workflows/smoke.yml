name: Node.js smoke tests
on:
  pull_request:
  push:
    branches: [main, feat/vercel-cloud]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=optional --no-audit --no-fund
      - run: node --check server.js
      - run: node --check iniciar.js
      - run: node --test tests/server-runtime.test.js
