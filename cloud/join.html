<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Quizzz! · Entrar a la sala</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a315a;background:#f5f8ff}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top left,#dbe8ff,transparent 45%),#f8faff}
main{max-width:520px;margin:8vh auto;padding:24px}h1{font-size:clamp(32px,7vw,48px);margin:0 0 12px}.logo{font-size:30px;font-weight:900;color:#6888e3;margin-bottom:30px}.logo span{color:#f3bc33}
.card{background:white;border:1px solid #dae3f4;border-radius:24px;padding:30px;box-shadow:0 15px 45px #1a35620d}
label{font-size:.94rem;font-weight:700;display:block;margin:18px 0 6px}input{width:100%;font:inherit;padding:14px;border:1px solid #bdcbe4;border-radius:12px;color:inherit}
button{font:inherit;border:0;background:#315cce;color:white;font-weight:750;border-radius:12px;padding:14px 20px;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}.full{width:100%;margin-top:25px}.hint{color:#586d88;line-height:1.5}
.status{min-height:1.5rem;margin:20px 0 0;color:#526886}.status[data-type=error]{color:#a22035}.status[data-type=success]{color:#217347}
[hidden]{display:none!important}.wait{text-align:center}.count{font-size:28px;font-weight:800}
</style><script defer src="/join.js"></script></head><body>
<main><div class="logo">Quizzz<span>!!!</span></div>
<section id="join-section" class="card"><h1>¡Entra a jugar!</h1>
<p class="hint">Acceso de prueba mediante invitación del formador. Las preguntas todavía no están habilitadas.</p>
<form id="join-form">
<label for="pin">PIN de la sala</label><input id="pin" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required placeholder="123456">
<label for="nickname">Tu nombre de jugador</label><input id="nickname" maxlength="32" minlength="2" autocomplete="nickname" required placeholder="¿Cómo quieres llamarte?">
<button id="join-button" type="submit" class="full">Entrar en la sala</button></form>
<p id="join-status" class="status" aria-live="polite" role="status"></p></section>
<section id="waiting-section" class="card wait" hidden>
<h1>¡Ya estás dentro!</h1><p id="welcome" class="hint"></p><p class="count" id="participant-count"></p>
<p id="waiting-text" class="hint">Esperando al formador…</p>
<button id="leave" type="button">Salir de la sala</button>
<p id="waiting-status" class="status" aria-live="polite" role="status"></p></section>
<p class="hint">Quizzz! · Vista previa protegida. No compartas el enlace fuera del grupo de pruebas.</p>
</main></body></html>
